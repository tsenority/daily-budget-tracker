name: Backend CI

permissions:
  id-token: write
  contents: read

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_test_password
          MYSQL_DATABASE: budgettracker
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        env:
          DB_PASSWORD: ci_test_password
          JWT_SECRET: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
        run: bash ./mvnw clean package

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/daily-budget-tracker:latest .

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/daily-budget-tracker:latest

      - name: Debug OIDC identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          })
          token = json.load(urllib.request.urlopen(req))["value"]
          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          for key in ["sub", "aud", "iss"]:
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Verify AWS connection
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: aws sts get-caller-identity

      - name: Deploy backend to EC2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-074af82d87de826f9" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "docker pull tsenor08/daily-budget-tracker:latest",
              "docker stop budget-backend",
              "docker rm budget-backend",
              "docker run -d --name budget-backend --network budget-network --restart unless-stopped --env-file /home/ec2-user/budget.env -e SPRING_DATASOURCE_URL=jdbc:mysql://budget-mysql:3306/budget_tracker -e SPRING_DATASOURCE_USERNAME=root -p 8080:8080 tsenor08/daily-budget-tracker:latest",
              "docker restart budget-frontend",
              "docker ps"
            ]' \
            --region us-west-2 \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-074af82d87de826f9" \
            --region us-west-2